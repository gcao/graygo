[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graygo"
version = "0.1.0"
description = "Simultaneous toroidal Go and reproducible learning experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["torch>=2.4", "scipy>=1.13"]

[project.scripts]
graygo = "graygo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graygo = ["native/*.cpp"]
